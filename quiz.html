<!DOCTYPE html>
<html lang="en">
<head>

<style>

    header h1 { margin:0;}
    nav a { color:white; margin:0 15px; text-decoration:none; font-weight:bold;}
    nav a:hover { text-decoration:underline;}
    main { padding:20px;}
    .question { background:white; padding:20px; margin-bottom:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);}

</style>
</head>
<body>

<main>

    <div id="quizContainer"></div>

<footer>
    <p>Website made by Nomaan Bin Ajaz</p>
</footer>

<script>

    {q:"Which organ filters blood in humans?",options:["Kidneys","Heart","Lungs","Liver"],answer:0},
    {q:"What force keeps us on the ground?",options:["Gravity","Magnetism","Friction","Inertia"],answer:0},
    {q:"Which scientist discovered the electron?",options:["J.J. Thomson","Isaac Newton","Albert Einstein","Marie Curie"],answer:0},
    {q:"Which organ produces insulin?",options:["Pancreas","Liver","Heart","Kidney"],answer:0},
    {q:"What is the center of an atom called?",options:["Nucleus","Electron","Proton","Neutron"],answer:0},
    {q:"What is Hubble known for?",options:["Expanding Universe","Gravity","DNA Structure","Penicillin"],answer:0},
    {q:"Which blood cells fight infection?",options:["White Blood Cells","Red Blood Cells","Platelets","Plasma"],answer:0},
    {q:"What is Earth's largest planet?",options:["Jupiter","Saturn","Earth","Neptune"],answer:0},
    {q:"Which element is needed for bones?",options:["Calcium","Iron","Sodium","Potassium"],answer:0},
    {q:"Who invented the first telescope?",options:["Galileo Galilei","Isaac Newton","Albert Einstein","Marie Curie"],answer:0},
    {q:"Which gas is used in balloons to float?",options:["Helium","Hydrogen","Oxygen","Nitrogen"],answer:0},
    {q:"What type of energy is stored in food?",options:["Chemical Energy","Kinetic Energy","Heat","Light"],answer:0},
    {q:"Which planet is closest to the Sun?",options:["Mercury","Venus","Earth","Mars"],answer:0},
    {q:"Who discovered gravity?",options:["Isaac Newton","Albert Einstein","Galileo Galilei","Nikola Tesla"],answer:0},
    {q:"Which organ pumps blood?",options:["Heart","Lungs","Kidney","Liver"],answer:0},
    {q:"Which vitamin is produced by sunlight?",options:["Vitamin D","Vitamin C","Vitamin A","Vitamin B12"],answer:0},

    {q:"Who discovered the electron?",options:["J.J. Thomson","Isaac Newton","Faraday","Curie"],answer:0},
    {q:"What is the chemical formula for table salt?",options:["NaCl","KCl","CaCO3","H2O"],answer:0},

    {q:"Which type of galaxy is the Milky Way?",options:["Spiral","Elliptical","Irregular","Lenticular"],answer:0},
    {q:"Which organ produces bile?",options:["Liver","Gallbladder","Kidney","Heart"],answer:0},
    {q:"What is the main gas in the Sun?",options:["Hydrogen","Helium","Oxygen","Carbon Dioxide"],answer:0}
];

// Generate quiz dynamically
const container = document.getElementById("quizContainer");
quizData.forEach((item,index)=>{
    const div = document.createElement("div");
    div.className = "question";
    div.innerHTML = `<p>${index+1}. ${item.q}</p>`;
    item.options.forEach((opt,optIndex)=>{
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = ()=>{ 
            if(optIndex===item.answer){ btn.style.backgroundColor='green'; alert('Correct!'); }
            else { btn.style.backgroundColor='red'; alert('Wrong! Try again.'); }
        };
        div.appendChild(btn);
    });
    container.appendChild(div);
});
</script>

</body>
</html>
